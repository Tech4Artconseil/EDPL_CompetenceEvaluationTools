# =============================================================================
# build-windows.yml — Build PyInstaller Windows via GitHub Actions
# =============================================================================
# Déclenché sur :
#   - push sur main/master
#   - déclenchement manuel (onglet "Actions" → "Run workflow")
#
# Artefact produit : EDPL_EvaluationTool_vX.Y-bNNN_YYYYMMDD_Windows.zip
#   → téléchargeable dans l'onglet "Actions" → run → "Artifacts"
# =============================================================================

name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout du dépôt
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Python 3.11 — SQLAlchemy 2.0.x est incompatible avec Python 3.14+
      # ------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ------------------------------------------------------------------
      # 3. Installation des dépendances + PyInstaller
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pyinstaller

      # ------------------------------------------------------------------
      # 4. Compilation via build_windows.bat
      #    Le script gère uniquement PyInstaller + version.
      #    Seed DB et trombi sont gérés explicitement ci-après.
      #    Sortie : BUILDING\dist\EDPL_EvaluationTool\
      # ------------------------------------------------------------------
      - name: Build Windows app
        run: |
          cmd /c BUILDING\build_windows.bat

      # ------------------------------------------------------------------
      # 5. Génération de la BDD seed (étape explicite — échec = build KO)
      #    create_seed_db.py est autonome (stdlib uniquement, pas d'imports app)
      # ------------------------------------------------------------------
      - name: Generate seed DB
        shell: pwsh
        run: |
          $distDir = "BUILDING\dist\EDPL_EvaluationTool"
          New-Item -ItemType Directory -Force -Path "$distDir\instance" | Out-Null
          python BUILDING\create_seed_db.py "$distDir\instance\evaluat.db"
          if ($LASTEXITCODE -ne 0) { Write-Error "ERREUR : create_seed_db.py a échoué."; exit 1 }
          if (-not (Test-Path "$distDir\instance\evaluat.db")) {
            Write-Error "ERREUR : evaluat.db absent après génération !"; exit 1
          }
          Write-Host "  OK : $distDir\instance\evaluat.db créée."

      # ------------------------------------------------------------------
      # 6. Nettoyage trombi — garder uniquement les 5 images de démo
      #    (Les images démo sont embarquées par PyInstaller via static/)
      # ------------------------------------------------------------------
      - name: Cleanup trombi
        shell: pwsh
        run: |
          $trombiDir = "BUILDING\dist\EDPL_EvaluationTool\_internal\static\uploads\trombi"
          $demoImages = @("DUPONT_Alice.png","MARTIN_Thomas.png","BERNARD_Lea.png","MOREAU_Julien.jpg","PETIT_Emma.jpg")
          if (Test-Path $trombiDir) {
            $removed = 0
            Get-ChildItem -Path $trombiDir -File | ForEach-Object {
              if ($demoImages -notcontains $_.Name) {
                Remove-Item $_.FullName -Force
                $removed++
              }
            }
            Write-Host "Trombi : $removed image(s) supprimée(s), 5 images démo conservées."
          } else {
            Write-Warning "Dossier trombi introuvable — PyInstaller n'a peut-être pas embarqué static/."
          }

      # ------------------------------------------------------------------
      # 7. Reconstitution du nom de version (après incrément par le script)
      #    VERSION.txt  → "1.0"   →  BASE=1.0
      #    build_counter.txt → ex: "7" → PADDED=007
      #    → ver = v1.0-b007_20260305
      # ------------------------------------------------------------------
      - name: Compute version string
        id: version
        shell: pwsh
        run: |
          $base = (Get-Content BUILDING\VERSION.txt -Raw).Trim()
          $cnt  = [int](Get-Content BUILDING\build_counter.txt -Raw).Trim()
          $padded = $cnt.ToString("D3")
          $date = (Get-Date -Format "yyyyMMdd")
          $ver  = "v${base}-b${padded}_${date}"
          echo "ver=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Version calculée : $ver"

      # ------------------------------------------------------------------
      # 8. Création du ZIP
      # ------------------------------------------------------------------
      - name: Zip distribution
        shell: pwsh
        run: |
          $zipName = "EDPL_EvaluationTool_${{ steps.version.outputs.ver }}_Windows.zip"
          Compress-Archive -Path "BUILDING\dist\EDPL_EvaluationTool\*" -DestinationPath $zipName
          Write-Host "Archive créée : $zipName"

      # ------------------------------------------------------------------
      # 9. Upload de l'artefact (conservé 30 jours)
      # ------------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDPL_EvaluationTool_${{ steps.version.outputs.ver }}_Windows
          path: EDPL_EvaluationTool_${{ steps.version.outputs.ver }}_Windows.zip
          retention-days: 30
