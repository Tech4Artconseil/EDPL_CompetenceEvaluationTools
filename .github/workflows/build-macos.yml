# =============================================================================
# build-macos.yml — Build PyInstaller macOS via GitHub Actions
# =============================================================================
# Déclenché sur :
#   - push sur main/master touchant le code de l'app
#   - déclenchement manuel (onglet "Actions" → "Run workflow")
#
# Artefact produit : EDPL_EvaluationTool_vX.Y-bNNN_YYYYMMDD_macOS.zip
#   → téléchargeable dans l'onglet "Actions" → run → "Artifacts"
# =============================================================================

name: Build macOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout du dépôt
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Python 3.11 — SQLAlchemy 2.0.x est incompatible avec Python 3.14+
      # ------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ------------------------------------------------------------------
      # 3. Installation des dépendances + PyInstaller
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pyinstaller

      # ------------------------------------------------------------------
      # 4. Compilation via build_mac.sh
      #    Le script gère uniquement PyInstaller + version.
      #    Seed DB et trombi sont gérés explicitement ci-après.
      #    Sortie : BUILDING/dist/EDPL_EvaluationTool/
      # ------------------------------------------------------------------
      - name: Build macOS app
        run: |
          chmod +x BUILDING/build_mac.sh
          bash BUILDING/build_mac.sh

      # ------------------------------------------------------------------
      # 5. Génération de la BDD seed (étape explicite — échec = build KO)
      #    create_seed_db.py est autonome (stdlib uniquement, pas d'imports app)
      # ------------------------------------------------------------------
      - name: Generate seed DB
        run: |
          DIST_DIR="BUILDING/dist/EDPL_EvaluationTool"
          mkdir -p "${DIST_DIR}/instance"
          python BUILDING/create_seed_db.py "${DIST_DIR}/instance/evaluat.db"
          echo "Vérification de la BDD seed..."
          test -f "${DIST_DIR}/instance/evaluat.db" || { echo "ERREUR : evaluat.db absent !"; exit 1; }
          echo "  OK : ${DIST_DIR}/instance/evaluat.db créée."

      # ------------------------------------------------------------------
      # 6. Nettoyage trombi — garder uniquement les 5 images de démo
      #    (Les images démo sont embarquées par PyInstaller via static/)
      # ------------------------------------------------------------------
      - name: Cleanup trombi
        run: |
          TROMBI_DIR="BUILDING/dist/EDPL_EvaluationTool/_internal/static/uploads/trombi"
          DEMO_IMAGES="DUPONT_Alice.png MARTIN_Thomas.png BERNARD_Lea.png MOREAU_Julien.jpg PETIT_Emma.jpg"
          if [ -d "$TROMBI_DIR" ]; then
            REMOVED=0
            for f in "$TROMBI_DIR"/*; do
              fname=$(basename "$f")
              keep=0
              for demo in $DEMO_IMAGES; do
                [ "$fname" = "$demo" ] && keep=1 && break
              done
              if [ $keep -eq 0 ]; then
                rm -f "$f"
                REMOVED=$((REMOVED + 1))
              fi
            done
            echo "Trombi : $REMOVED image(s) supprimée(s), 5 images démo conservées."
          else
            echo "AVERTISSEMENT : dossier trombi introuvable — PyInstaller n'a peut-être pas embarqué static/."
          fi

      # ------------------------------------------------------------------
      # 7. Reconstitution du nom de version (après incrément par le script)
      #    VERSION.txt  → "1.0"   →  BASE=1.0
      #    build_counter.txt → ex: "7" → PADDED=007
      #    → ver = v1.0-b007_20260305
      # ------------------------------------------------------------------
      - name: Compute version string
        id: version
        run: |
          BASE=$(cat BUILDING/VERSION.txt | tr -d '[:space:]')
          CNT=$(cat BUILDING/build_counter.txt | tr -d '[:space:]')
          PADDED=$(printf '%03d' "$CNT")
          BUILD_DATE=$(date '+%Y%m%d')
          VER="v${BASE}-b${PADDED}_${BUILD_DATE}"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "Version calculée : ${VER}"

      # ------------------------------------------------------------------
      # 8. Création du ZIP
      # ------------------------------------------------------------------
      - name: Zip distribution
        run: |
          ZIP_NAME="EDPL_EvaluationTool_${{ steps.version.outputs.ver }}_macOS.zip"
          cd BUILDING/dist
          zip -r "../../${ZIP_NAME}" EDPL_EvaluationTool/
          echo "Archive créée : ${ZIP_NAME}"

      # ------------------------------------------------------------------
      # 9. Upload de l'artefact (conservé 30 jours)
      # ------------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDPL_EvaluationTool_${{ steps.version.outputs.ver }}_macOS
          path: EDPL_EvaluationTool_${{ steps.version.outputs.ver }}_macOS.zip
          retention-days: 30
